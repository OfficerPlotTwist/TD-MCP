<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TD Color Mask</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="toolbar">
  <button id="tool-wand" class="tool active">Wand</button>

<script src="/floodfill.js"></script>
<script src="/app.js"></script>
</body>
</html>
